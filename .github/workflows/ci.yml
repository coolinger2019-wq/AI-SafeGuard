name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 单元测试
        run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy 门禁
        run: cargo clippy --workspace --all-targets -- -D warnings

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 cargo-deny / cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: 依赖审计（已知漏洞）
        run: cargo audit
      - name: 供应链门禁（许可证/来源/黑名单）
        run: cargo deny check

  sbom:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      - name: 构建嵌入依赖清单的二进制（SBOM）
        run: cargo auditable build --release
      - uses: actions/upload-artifact@v4
        with:
          name: aisafeguard-sbom-bin
          path: target/release/aisafeguard.exe
