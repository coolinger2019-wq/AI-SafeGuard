name: build
# push main → 双平台产物（workflow artifact，验证可复现性）
# push v*  → 双平台构建 + 发布 GitHub Release（install.sh/deploy.sh 的下载源）
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 LLVM-19（eBPF 重编所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19

      - name: 安装 nightly + rust-src（eBPF 构建目标）
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: 安装 bpf-linker
        run: cargo install bpf-linker --version '~0.9'

      - name: 重编 eBPF 对象（F807：源码→.o 可复现构建，替代仓库内置产物）
        working-directory: crates/aisafeguard-xdp/ebpf
        env:
          LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
        run: bash build.sh

      - name: 安装 cargo-auditable（SBOM：依赖清单嵌入二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      - name: 编译 release 主程序（显式 +stable：nightly 只给 eBPF 用）
        run: cargo +stable auditable build --release --bin aisafeguard

      # 产物先收进扁平 dist/：upload-artifact 会保留相对仓库根的路径层级，
      # 混层的话 release job 的文件名对不上（v0.8.0 首次双平台发布漏过 .o）
      - name: 汇总产物 + 校验和
        run: |
          mkdir -p dist
          cp target/release/aisafeguard dist/aisafeguard
          cp crates/aisafeguard-xdp/objects/aisafeguard_xdp.o dist/aisafeguard_xdp.o
          (cd dist && sha256sum aisafeguard > aisafeguard.sha256)
          (cd dist && sha256sum aisafeguard_xdp.o > aisafeguard_xdp.o.sha256)

      - name: 上传构建产物（每次 push 保留 90 天）
        uses: actions/upload-artifact@v7
        with:
          name: aisafeguard-linux-x64
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-auditable（SBOM：依赖清单嵌入二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      # Windows 无 eBPF：仓库内置 .o 仅作为字节嵌入，不参与内核加载
      - name: 编译 release 主程序
        run: cargo auditable build --release --bin aisafeguard

      - name: 打包 + 校验和
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/aisafeguard.exe -DestinationPath dist/aisafeguard-windows-x64.zip
          $h = (Get-FileHash dist/aisafeguard-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          # 必须 LF：Out-File 默认 CRLF，用户侧 sha256sum -c 会因文件名带 \r 失败
          [IO.File]::WriteAllText("$PWD/dist/aisafeguard-windows-x64.zip.sha256", "$h  aisafeguard-windows-x64.zip`n")

      - name: 上传构建产物（每次 push 保留 90 天）
        uses: actions/upload-artifact@v7
        with:
          name: aisafeguard-windows-x64
          path: dist/

  release:
    # 双平台都构建成功才发布；任一失败则 Release 保持原样，不出现半套产物
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aisafeguard-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # 缺件即失败：宁可 Release 不更新，也不发半套产物
          fail_on_unmatched_files: true
          files: |
            dist/aisafeguard
            dist/aisafeguard.sha256
            dist/aisafeguard_xdp.o
            dist/aisafeguard_xdp.o.sha256
            dist/aisafeguard-windows-x64.zip
            dist/aisafeguard-windows-x64.zip.sha256
