name: build
# push main → 双平台产物（workflow artifact，验证可复现性）
# push v*  → 双平台构建 + 发布 GitHub Release（install.sh/deploy.sh 的下载源）
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 LLVM-19（eBPF 重编所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19

      - name: 安装 nightly + rust-src（eBPF 构建目标）
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: 安装 bpf-linker
        run: cargo install bpf-linker --version '~0.9'

      - name: 重编 eBPF 对象（F807：源码→.o 可复现构建，替代仓库内置产物）
        working-directory: crates/aisafeguard-xdp/ebpf
        env:
          LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
        run: bash build.sh

      - name: 安装 cargo-auditable（SBOM：依赖清单嵌入二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      - name: 编译 release 主程序（显式 +stable：nightly 只给 eBPF 用）
        run: cargo +stable auditable build --release --bin aisafeguard

      - name: 校验和
        run: |
          (cd target/release && sha256sum aisafeguard) > aisafeguard.sha256
          (cd crates/aisafeguard-xdp/objects && sha256sum aisafeguard_xdp.o) > aisafeguard_xdp.o.sha256

      - name: 上传构建产物（每次 push 保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: aisafeguard-linux-x64
          path: |
            target/release/aisafeguard
            aisafeguard.sha256
            crates/aisafeguard-xdp/objects/aisafeguard_xdp.o
            aisafeguard_xdp.o.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-auditable（SBOM：依赖清单嵌入二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      # Windows 无 eBPF：仓库内置 .o 仅作为字节嵌入，不参与内核加载
      - name: 编译 release 主程序
        run: cargo auditable build --release --bin aisafeguard

      - name: 打包 + 校验和
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/aisafeguard.exe -DestinationPath aisafeguard-windows-x64.zip
          $h = (Get-FileHash aisafeguard-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  aisafeguard-windows-x64.zip" | Out-File -Encoding ascii aisafeguard-windows-x64.zip.sha256

      - name: 上传构建产物（每次 push 保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: aisafeguard-windows-x64
          path: |
            aisafeguard-windows-x64.zip
            aisafeguard-windows-x64.zip.sha256

  release:
    # 双平台都构建成功才发布；任一失败则 Release 保持原样，不出现半套产物
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aisafeguard-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aisafeguard
            dist/aisafeguard.sha256
            dist/aisafeguard_xdp.o
            dist/aisafeguard_xdp.o.sha256
            dist/aisafeguard-windows-x64.zip
            dist/aisafeguard-windows-x64.zip.sha256
