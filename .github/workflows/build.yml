name: build
# push main → 双平台产物（workflow artifact，验证可复现性）
# push v*  → 双平台构建 + 发布 GitHub Release（install.sh/deploy.sh 的下载源）
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    # 固定 24.04：产物动态链接构建机的 glibc，runner 升到 26.04（glibc 2.43）
    # 会让 24.04 部署机直接起不来（v0.8.3 首次发布事故）。24.04 的 glibc 2.39
    # 与目标机一致；llvm-19-dev 在 24.04 可直装（0.8.2 即此环境构建）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 LLVM-19（eBPF 重编所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19

      - name: 安装 nightly + rust-src（eBPF 构建目标）
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: 安装 bpf-linker
        run: cargo install bpf-linker --version '~0.9'

      - name: 重编 eBPF 对象（F807：源码→.o 可复现构建，替代仓库内置产物）
        working-directory: crates/aisafeguard-xdp/ebpf
        env:
          LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
        run: bash build.sh

      - name: 安装 cargo-auditable（SBOM：依赖清单嵌入二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      - name: 编译 release 主程序（显式 +stable：nightly 只给 eBPF 用）
        run: cargo +stable auditable build --release --bin aisafeguard

      # 产物先收进扁平 dist/：upload-artifact 会保留相对仓库根的路径层级，
      # 混层的话 release job 的文件名对不上（v0.8.0 首次双平台发布漏过 .o）
      - name: 汇总产物 + 校验和
        run: |
          mkdir -p dist
          cp target/release/aisafeguard dist/aisafeguard
          cp crates/aisafeguard-xdp/objects/aisafeguard_xdp.o dist/aisafeguard_xdp.o
          (cd dist && sha256sum aisafeguard > aisafeguard.sha256)
          (cd dist && sha256sum aisafeguard_xdp.o > aisafeguard_xdp.o.sha256)

      - name: 上传构建产物（每次 push 保留 90 天）
        uses: actions/upload-artifact@v7
        with:
          name: aisafeguard-linux-x64
          path: dist/

  build-windows:
    # 固定 2022：Windows 产物无 glibc 前向兼容问题，但 windows-latest 迁镜像大
    # 版本（2025→2027）时 MSVC/Windows SDK 随之升级——工具链静默变化对发版
    # 构建是供应链漂移（与 LESSONS v0.8.3 Linux 侧 runner 漂移同根因，那次砸的
    # 是 glibc，这里砸的是编译器行为/依赖构建假设）。发版构建钉死 runner，
    # 工具链升级 = 手动换钉 + 发版全量验证，不做自动漂移升级。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-auditable（SBOM：依赖清单嵌入二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      # Windows 无 eBPF：仓库内置 .o 仅作为字节嵌入，不参与内核加载
      - name: 编译 release 主程序
        run: cargo auditable build --release --bin aisafeguard

      - name: 打包 + 校验和
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/aisafeguard.exe -DestinationPath dist/aisafeguard-windows-x64.zip
          $h = (Get-FileHash dist/aisafeguard-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          # 必须 LF：Out-File 默认 CRLF，用户侧 sha256sum -c 会因文件名带 \r 失败
          [IO.File]::WriteAllText("$PWD/dist/aisafeguard-windows-x64.zip.sha256", "$h  aisafeguard-windows-x64.zip`n")

      - name: 上传构建产物（每次 push 保留 90 天）
        uses: actions/upload-artifact@v7
        with:
          name: aisafeguard-windows-x64
          path: dist/

  release:
    # 双平台都构建成功才发布；任一失败则 Release 保持原样，不出现半套产物
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aisafeguard-*
          path: dist
          merge-multiple: true

      # P0-3 发布签名：用 build-linux 产物里的 aisafeguard 对每个 .sha256 逐文件
      # 签出 .sha256.sig（ECDSA P-256，ring fixed-width R||S——用自家二进制自签，
      # 不引 openssl、无 DER 转换歧义）。私钥在 GitHub Secret
      # AISAFEGUARD_SIGNING_KEY（aisafeguard gen-signing-key 生成，见 docs/RELEASE.md）；
      # secret 未配置（首次发布/轮换期）时告警并跳过签名——客户端对缺 .sig 的
      # release 也跳过验签，Release 照常发布（上传列表按实际产物拼装，
      # 缺 .sig 不会触发 fail_on_unmatched_files）。
      - name: 签名发布校验和（ECDSA P-256）
        env:
          SIGNING_KEY: ${{ secrets.AISAFEGUARD_SIGNING_KEY }}
        run: |
          chmod +x dist/aisafeguard
          KEY="$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')"
          {
            echo "RELEASE_FILES<<EOF"
            echo "dist/aisafeguard"
            echo "dist/aisafeguard.sha256"
            echo "dist/aisafeguard_xdp.o"
            echo "dist/aisafeguard_xdp.o.sha256"
            echo "dist/aisafeguard-windows-x64.zip"
            echo "dist/aisafeguard-windows-x64.zip.sha256"
            if [ -n "$KEY" ]; then
              for f in dist/aisafeguard.sha256 dist/aisafeguard_xdp.o.sha256 dist/aisafeguard-windows-x64.zip.sha256; do
                ./dist/aisafeguard sign-manifest "$f" --key "$KEY" > "$f.sig"
                echo "已签名 $f.sig"
                echo "$f.sig"
              done
            else
              echo "::warning::AISAFEGUARD_SIGNING_KEY 未配置，跳过发布签名（配置见 docs/RELEASE.md）"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          # 缺件即失败：宁可 Release 不更新，也不发半套产物
          # （列表在签名步骤按实际产物拼装：有 secret 时含三个 .sha256.sig）
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_FILES }}
