# cargo-deny 配置：CI 供应链门禁（cargo deny check）
# 首次运行如遇个别传递依赖许可证未覆盖，先评估再扩充 allow 列表，不要直接放宽为 warn。

[advisories]
version = 2
yanked = "deny"
ignore = [
    # egui 0.36 字体栈（winit/sctk-adwaita → ab_glyph → ttf-parser）：作者宣布停止维护，
    # 无安全升级路径（egui 升级换 skrifa 时移除本条）。0.5.9 H101 首次在
    # cargo-deny 0.20 下跑绿门禁时评估收录。
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    # WinDivert（windivert / windivert-sys，仅 Windows 采样捕获用）：
    # 上游为 LGPL-3.0-or-later / GPL-2.0 双许可，crate 声明 LGPL-3.0-or-later。
    # 选 LGPL 分支使用；用户态库静态编入（本项目 MIT 开源、源码与构建脚本完整，
    # 满足 LGPL-3 §4 的可重链接要求），内核驱动 WinDivert64.sys 为运行期独立文件，
    # 不构成衍生作品。合规说明见 docs/COMPLIANCE.md。
    "LGPL-3.0-or-later",
    # egui 0.36 的 epaint_default_fonts 内置字体包（Empyrean 等随 crate 再分发的字体）：
    # OFL-1.1（OSI/FSF 认可）与 Ubuntu-font-1.0（允许再分发，须保留许可与字体名）。
    # 均为宽松字体许可，仅影响随包字体文件，0.5.9 H101 评估收录。
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
