[workspace]
resolver = "2"
members = [
    "crates/aisafeguard-core",
    "crates/aisafeguard-store",
    "crates/aisafeguard-firewall",
    "crates/aisafeguard-l7",
    "crates/aisafeguard-rules",
    "crates/aisafeguard-xdp",
    "crates/aisafeguard-honeypot",
    "crates/aisafeguard-ai",
    "crates/aisafeguard-detect",
    "crates/aisafeguard-app",
]

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "MIT"
authors = ["coolinger (vibe coding)"]

[patch.crates-io]
# 0.5.0：static 特性下 windivert.c 的全局 memcpy/memset 劫持 CRT intrinsic，
# release 构建进程早期堆损坏爆栈（0.3.1 引入）。fork 去劫持，见 docs/LESSONS.md。
windivert-sys = { path = "third_party/windivert-sys" }

[workspace.dependencies]
# 内部 crate 只用 path 引用：workspace 内同仓同版，钉 version 只会每次发版多改十行且必然漂移
aisafeguard-core = { path = "crates/aisafeguard-core" }
aisafeguard-store = { path = "crates/aisafeguard-store" }
aisafeguard-firewall = { path = "crates/aisafeguard-firewall" }
aisafeguard-l7 = { path = "crates/aisafeguard-l7" }
aisafeguard-rules = { path = "crates/aisafeguard-rules" }
aisafeguard-xdp = { path = "crates/aisafeguard-xdp" }
aisafeguard-honeypot = { path = "crates/aisafeguard-honeypot" }
aisafeguard-ai = { path = "crates/aisafeguard-ai" }
aisafeguard-detect = { path = "crates/aisafeguard-detect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util", "signal"] }
toml = "0.9"
toml_edit = "0.25"
thiserror = "2"
dirs = "6"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
sha2 = "0.10"
# 组织协同 mTLS（0.3.6）：rcgen 签发组织 CA 与节点证书（ring 后端与 reqwest 的
# rustls-tls 同一加密栈）；tokio-rustls 手写 accept 循环做 /fed 独立 mTLS 面。
# 注意：不走 axum-server 的 tls-rustls 特性——rustls 默认 provider 是 aws-lc-rs
# （Windows 构建要 CMake/NASM），feature 合并会悄悄引入；显式 ring 保持依赖树纯净。
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
hyper-util = { version = "0.1", features = ["service"] }
time = { version = "0.3", default-features = false, features = ["std"] }
etherparse = "0.18"
# F806 蜜罐双栈监听：显式 IPV6_V6ONLY=false（Windows 默认 v6only=1，不显式设
# 会导致 v4 蜜罐面消失）；tokio 传递依赖树里已有，仅提升为直接依赖
socket2 = { version = "0.6", default-features = false }
# Linux 采样捕获（AF_PACKET 原始套接字，安全 API，仅 Linux 目标编译）。
# time 特性：rustix 1.1.5 的 net 单独启用时 linux_raw 后端缺 timespec（sockopt 需要）
rustix = { version = "1.1", features = ["net", "time"] }
axum = "0.8"
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
# H101：russh SSH 服务端（蜜罐中交互）。默认特性是 aws-lc-rs——Windows 构建要
# CMake/NASM，feature 合并会悄悄引入（0.3.6 rustls 同款坑），必须关默认特性显式选
# ring（与 rustls/rcgen 同一加密栈）。rsa/flate2 等可选特性按需再加。
russh = { version = "0.65", default-features = false, features = ["ring"] }
# 版本必须与 russh 内部一致（其依赖树是 rand 0.10 / rand_core 0.10），否则
# PrivateKey::random 的 Rng 泛型不匹配。
rand = "0.10"
# H200 凭证哈希（0.5.10）：RustCrypto argon2id，纯 Rust 无 C 后端。口令只存
# 加盐哈希用于比对与频次统计，不还原不展示。参数刻意调低（见 cred.rs）：
# 被哈希的是攻击者自选的口令，抗爆破价值趋近于零，换取高频撞库时不烧 CPU。
argon2 = "0.6"
# H200 本机账号快照（0.5.10）：跨平台账号枚举的安全封装（Windows 内部走
# NetUserEnum、Linux 读 /etc/passwd）。仓库 forbid(unsafe_code)，不能直接调
# FFI，按 AGENTS 第 5 条选成熟维护库；只开 users 特性收敛依赖面。
sysinfo = { version = "0.37", default-features = false, features = ["user"] }
# H210 文件系统蜜饵（0.5.10，仅 Linux 目标编译）：inotify 只读监听「文件被读取」
notify = "8"
# F100 fed 消息级签名：ring 直接签名/验签（ECDSA P-256，与节点证书同栈同钥）；
# x509-parser 从证书 DER 提取 SPKI 公钥（rcgen 的 x509-parser 特性早已引入，零新增树）
ring = "0.17"
x509-parser = "0.16"
# F740 入伙向导：egui 生态标准的原生文件对话框（申请/批准包选择与保存）
rfd = "0.15"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
strip = true
