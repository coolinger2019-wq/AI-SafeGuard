[workspace]
resolver = "2"
members = [
    "crates/aisafeguard-core",
    "crates/aisafeguard-store",
    "crates/aisafeguard-firewall",
    "crates/aisafeguard-l7",
    "crates/aisafeguard-rules",
    "crates/aisafeguard-xdp",
    "crates/aisafeguard-honeypot",
    "crates/aisafeguard-ai",
    "crates/aisafeguard-detect",
    "crates/aisafeguard-app",
]

[workspace.package]
version = "0.5.7"
edition = "2024"
license = "MIT"
authors = ["coolinger (vibe coding)"]

[patch.crates-io]
# 0.5.0：static 特性下 windivert.c 的全局 memcpy/memset 劫持 CRT intrinsic，
# release 构建进程早期堆损坏爆栈（0.3.1 引入）。fork 去劫持，见 docs/LESSONS.md。
windivert-sys = { path = "third_party/windivert-sys" }

[workspace.dependencies]
aisafeguard-core = { path = "crates/aisafeguard-core" }
aisafeguard-store = { path = "crates/aisafeguard-store" }
aisafeguard-firewall = { path = "crates/aisafeguard-firewall" }
aisafeguard-l7 = { path = "crates/aisafeguard-l7" }
aisafeguard-rules = { path = "crates/aisafeguard-rules" }
aisafeguard-xdp = { path = "crates/aisafeguard-xdp" }
aisafeguard-honeypot = { path = "crates/aisafeguard-honeypot" }
aisafeguard-ai = { path = "crates/aisafeguard-ai" }
aisafeguard-detect = { path = "crates/aisafeguard-detect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util", "signal"] }
toml = "0.9"
thiserror = "2"
dirs = "6"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
sha2 = "0.10"
# 组织协同 mTLS（0.3.6）：rcgen 签发组织 CA 与节点证书（ring 后端与 reqwest 的
# rustls-tls 同一加密栈）；tokio-rustls 手写 accept 循环做 /fed 独立 mTLS 面。
# 注意：不走 axum-server 的 tls-rustls 特性——rustls 默认 provider 是 aws-lc-rs
# （Windows 构建要 CMake/NASM），feature 合并会悄悄引入；显式 ring 保持依赖树纯净。
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
hyper-util = { version = "0.1", features = ["service"] }
time = { version = "0.3", default-features = false, features = ["std"] }
etherparse = "0.18"
# Linux 采样捕获（AF_PACKET 原始套接字，安全 API，仅 Linux 目标编译）。
# time 特性：rustix 1.1.5 的 net 单独启用时 linux_raw 后端缺 timespec（sockopt 需要）
rustix = { version = "1.1", features = ["net", "time"] }
axum = "0.8"
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
strip = true
